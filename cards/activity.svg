<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img"><defs></defs>
<style>
text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .s{font-family:Georgia,'Times New Roman',serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes blink{50%{opacity:0}}
@keyframes swing{0%{opacity:0;transform:translateY(22px) rotate(-2deg)}70%{transform:translateY(-4px) rotate(.4deg)}100%{opacity:1;transform:none}}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.ring{animation:pulse 2.8s ease-in-out infinite}
.cur{animation:blink 1s steps(1) infinite}
.tile{animation:swing .9s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="880" height="250" rx="18" fill="#0a0f1c"/><rect x=".5" y=".5" width="879" height="249" rx="17.5" fill="none" stroke="#1c2740"/>
<text x="40" y="40" font-size="12" letter-spacing="2" fill="#17E8A0" class="m">ACTIVITY, LAST 12 MONTHS</text>
