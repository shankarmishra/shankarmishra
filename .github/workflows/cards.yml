name: Render profile cards

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh api graphql -f query='query{user(login:"shankarmishra"){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' > data/contributions.json
      - run: python scripts/render_cards.py
      - name: Commit regenerated cards
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || (git commit -m "cards: refresh" && git push)
